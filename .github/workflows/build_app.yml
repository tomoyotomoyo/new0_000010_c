name: Build KFLog IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build_app:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install ldid dpkg

      - name: Setup Theos
        run: |
          export THEOS=~/theos
          echo "THEOS=$THEOS" >> $GITHUB_ENV
          git clone --recursive https://github.com/theos/theos.git $THEOS
          cd $THEOS
          git submodule update --init --recursive

      - name: Download iOS SDK
        run: |
          export THEOS=~/theos
          mkdir -p $THEOS/sdks
          curl -L -o /tmp/sdks.zip "https://github.com/theos/sdks/archive/refs/heads/master.zip" || true
          if [ -f /tmp/sdks.zip ]; then
            unzip -q /tmp/sdks.zip -d /tmp/
            for sdk in /tmp/sdks-master/*.sdk; do
              if [ -d "$sdk" ]; then
                name=$(basename "$sdk")
                [[ "$name" == iPhoneOS* ]] && cp -R "$sdk" "$THEOS/sdks/"
              fi
            done
          fi
          ls -la $THEOS/sdks/

      - name: Prepare KFKernel sources
        run: |
          cp KFInit.c app/
          cp KFKernel.h app/
          cp -r kexploit sandbox apfs kpf xpf utils choma app/

      - name: Build KFLog App
        run: |
          export THEOS=~/theos
          cd app
          echo "=== Building KFLog ==="
          make clean
          make FINALPACKAGE=1
          echo "=== Done ==="
          ls -laR .theos/

      - name: Package IPA
        run: |
          cd app
          APP_DIR=$(find .theos -name "*.app" -type d | head -1)
          if [ -z "$APP_DIR" ]; then
            echo "ERROR: No .app directory found"
            exit 1
          fi
          echo "Found app: $APP_DIR"
          ls -la "$APP_DIR"
          mkdir -p Payload
          cp -R "$APP_DIR" "Payload/KFLog.app"
          ls -la "Payload/KFLog.app"
          zip -ry KFLog.ipa Payload
          rm -rf Payload
          echo "=== IPA contents ==="
          unzip -l KFLog.ipa | head -20
          ls -la KFLog.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: KFLog-IPA
          path: app/KFLog.ipa
          if-no-files-found: error
