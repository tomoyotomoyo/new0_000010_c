<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>KFLog</title>
<style>
  :root {
    --bg: #050505;
    --fg: #e0e0e0;
    --fg-dim: #6a6a6a;
    --red: #cc3333;
    --green: #33cc33;
    --mono: ui-monospace, "JetBrains Mono", "SF Mono", Consolas, "Liberation Mono", Menlo, "Courier New", monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--mono);
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    overflow-y: hidden;
  }

  body { position: relative; }

  ::selection { background: #333; color: var(--fg); }

  #bg-wrap {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    isolation: isolate;
  }

  #signal-pulse {
    position: absolute;
    left: 0; right: 0;
    top: 55vh;
    height: 3px;
    background: var(--green);
    mix-blend-mode: screen;
    pointer-events: none;
    opacity: 0;
    will-change: opacity;
  }
  #signal-pulse.flash {
    animation: signalFlash 90ms ease-out;
  }
  @keyframes signalFlash {
    0% { opacity: 0; }
    40% { opacity: 1; }
    100% { opacity: 0; }
  }

  #log-stream {
    /* === Mobile (<980px): full viewport width, symmetric padding on both
     * sides. Single strategy: left:0 + right:0 fills the viewport; padding
     * comp for safe-area. No centering trickery, no width:100%, no max-width
     * mix — one rule, one behavior, zero right-side gap. */
    position: fixed;
    top: 0;
    bottom: 24px;
    left: 0;
    right: 0;
    padding-left: max(1rem, env(safe-area-inset-left));
    padding-right: max(1rem, env(safe-area-inset-right));
    padding-top: 1.5rem;
    padding-bottom: 28px;
    z-index: 2;
    overflow-y: auto;
    overflow-x: hidden;
    font-size: 13px;
    line-height: 1.7;
    color: var(--fg);
    mask-image: linear-gradient(to top, transparent 0%, black 8%);
    -webkit-mask-image: linear-gradient(to top, transparent 0%, black 8%);
  }

  /* === Tablet/Desktop (>=980px): fixed 960px centered, via left:50% +
   * translateX(-50%) ONLY in this breakpoint. Width is explicit, no
   * width:100%/max-width conflict. One rule, one behavior. */
  @media (min-width: 980px) {
    #log-stream {
      left: 50%;
      right: auto;
      top: 0;
      bottom: 24px;
      width: 960px;
      transform: translateX(-50%);
      padding-left: 2rem;
      padding-right: 2rem;
      padding-top: 1.5rem;
      padding-bottom: 28px;
    }
  }

  #log-stream::-webkit-scrollbar { display: none; }

  .line {
    min-height: 1.5em;
    white-space: pre-wrap;
    word-break: break-all;
    padding: 0 2px;
  }
  .line.red { color: var(--red); }
  .line.green { color: var(--green); }
  .line.dim { color: var(--fg-dim); }

  .ts {
    color: var(--fg-dim);
    font-size: 12px;
    margin-right: 6px;
  }

  .tag {
    font-size: 11px;
    font-weight: bold;
    margin-right: 6px;
    color: var(--fg-dim);
  }

  #status {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 24px;
    background: rgba(0,0,0,0.9);
    display: flex;
    align-items: center;
    padding: 0 14px;
    gap: 10px;
    font-size: 11px;
    color: var(--fg-dim);
    z-index: 10;
    border-top: 1px solid #1a1a1a;
  }
  #status .dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: #333;
  }
  #status .dot.ok { background: var(--green); box-shadow: 0 0 3px var(--green); }
  #status .dot.err { background: var(--red); box-shadow: 0 0 3px var(--red); }
  #status .dot.warn { background: var(--fg-dim); }

  #input {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 2rem;
    background: transparent;
    border: none;
    outline: none;
    color: transparent;
    caret-color: transparent;
    font-family: var(--mono);
    font-size: 13px;
    z-index: 3;
    opacity: 0;
    pointer-events: auto;
    padding: 0 max(1rem, env(safe-area-inset-right)) 0 max(1rem, env(safe-area-inset-left));
  }
  @media (min-width: 980px) {
    #input {
      left: 50%;
      right: auto;
      width: 960px;
      transform: translateX(-50%);
      padding: 0 2rem;
    }
  }

  #orientation-gate { display: none; }
  @media (orientation: portrait) and (max-width: 900px) {
    #orientation-gate {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: var(--mono);
      font-size: 14px;
      line-height: 1.9;
      padding: 0 2rem;
      text-align: left;
    }
    #orientation-gate p { margin: 0; }
  }
</style>
</head>
<body>

<div id="bg-wrap">
  <div data-ascii-dither-bg aria-hidden="true" style="position:absolute;inset:0;pointer-events:none;overflow:hidden"></div>
  <div id="signal-pulse" aria-hidden="true"></div>
</div>

<div id="log-stream"></div>

<input id="input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="terminal input">

<div id="status">
  <div id="status-dot" class="dot"></div>
  <span id="status-text">standby</span>
  <span style="margin-left:auto" id="line-count">0</span>
</div>

<div id="orientation-gate" aria-hidden="true">
  <p>> portrait mode not supported.</p>
  <p>> rotate device to continue.</p>
</div>

<script src="ascii-dither-bg.js"></script>
<script>
(function() {
  const logStream = document.getElementById('log-stream');
  const pulse = document.getElementById('signal-pulse');
  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const lineCount = document.getElementById('line-count');
  let lc = 0;

  function flash() {
    pulse.classList.remove('flash');
    void pulse.offsetWidth;
    pulse.classList.add('flash');
  }

  function mkLine(text, cls) {
    const div = document.createElement('div');
    div.className = 'line' + (cls ? ' ' + cls : '');
    div.textContent = text;
    return div;
  }

  function append(text, cls) {
    const line = mkLine(text, cls);
    logStream.appendChild(line);
    flash();
    lc++;
    lineCount.textContent = lc;
    while (logStream.children.length > 500) {
      logStream.removeChild(logStream.firstChild);
      lc--;
    }
    logStream.scrollTop = logStream.scrollHeight;
  }

  window.addBootStep = function(text, type) {
    const cls = type === 'error' ? 'red' : type === 'success' ? 'green' : type === 'dim' ? 'dim' : '';
    append(text, cls);
  };

  window.addKernelLog = function(obj) {
    const ts = obj.t || '--:--';
    const tag = obj.tag || '[---]';
    const text = obj.text || '';
    const cls = obj.r ? 'red' : '';
    append(ts + ' ' + tag + ' ' + text, cls);
  };

  window.clearBoot = function() {
    logStream.innerHTML = '';
    lc = 0;
    lineCount.textContent = '0';
  };

  window.clearKernel = function() {
    logStream.innerHTML = '';
    lc = 0;
    lineCount.textContent = '0';
  };

  window.setStatus = function(state, text) {
    statusDot.className = 'dot ' + state;
    statusText.textContent = text;
  };

  window.send = function(cmd) {
    if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.kflog) {
      window.webkit.messageHandlers.kflog.postMessage(cmd);
    }
  };
})();
</script>
</body>
</html>
